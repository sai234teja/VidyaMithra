<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sign Up | VidyaMitra</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
  <script>
    (function() {
      let savedTheme = localStorage.getItem('vm_theme') || 'dark';
      if (savedTheme === 'system') savedTheme = 'dark';
      document.documentElement.setAttribute('data-theme', savedTheme);
    })();
  </script>
  <style>
    :root {
      --font-main: 'Plus Jakarta Sans', sans-serif;
    }

    * { margin:0; padding:0; box-sizing:border-box; font-family:var(--font-main); }
    body { background-color:var(--bg-primary); background-image:var(--gradient-bg); color:var(--text-primary); min-height:100vh; display:flex; align-items:center; justify-content:center; overflow-x:hidden; position:relative; }

    .bg-blobs { position:fixed; inset:0; z-index:-1; overflow:hidden; filter:blur(80px); }
    .blob { position:absolute; border-radius:50%; opacity:0.15; animation:move 20s infinite alternate; }
    .blob-1 { width:600px; height:600px; top:-200px; right:-100px; background:var(--accent); animation-duration:25s; }
    .blob-2 { width:400px; height:400px; bottom:-100px; left:-100px; background:var(--primary); animation-duration:20s; }
    .blob-3 { width:300px; height:300px; top:20%; left:-50px; background:var(--primary-400); opacity:0.08; animation-duration:30s; }

    @keyframes move { 
      0% { transform:translate(0, 0) scale(1); }
      50% { transform:translate(30px, -50px) scale(1.1); }
      100% { transform:translate(-20px, 30px) scale(1); }
    }

    .auth-container { width:100%; max-width:540px; padding:24px; z-index:10; }
    .auth-card { 
      background:var(--bg-card); 
      backdrop-filter:blur(24px); 
      border:1px solid var(--border-color); 
      border-radius:32px; 
      padding:48px; 
      box-shadow:var(--shadow-xl); 
      animation:authCardEntry 0.8s cubic-bezier(0.16, 1, 0.3, 1);
    }

    @keyframes authCardEntry { from { opacity:0; transform:translateY(40px); } to { opacity:1; transform:translateY(0); } }

    .auth-header { text-align:center; margin-bottom:40px; }
    .logo-container { width:54px; height:54px; background:linear-gradient(135deg, var(--primary), var(--accent)); border-radius:16px; display:flex; align-items:center; justify-content:center; font-size:1.5rem; margin:0 auto 16px; }
    .auth-card h2 { font-size:2rem; font-weight:800; letter-spacing:-0.02em; margin-bottom:8px; color:var(--text-primary); }
    .subtitle { color:var(--text-secondary); font-size:0.95rem; }

    .grid-form { display:grid; grid-template-columns:1fr 1fr; gap:16px; margin-bottom:24px; }
    .form-group { position:relative; }
    .full { grid-column:span 2; }

    .form-input { 
      width:100%; background:var(--bg-glass); border:1px solid var(--border-color); border-radius:16px; 
      padding:16px 20px 16px 48px; color:var(--text-primary); font-size:0.95rem; transition:all 0.3s; outline:none; 
    }
    .form-input:focus { border-color:var(--primary-500); background:var(--bg-glass-hover); transform:translateY(-2px); }
    .input-icon { position:absolute; left:18px; top:18px; font-size:1.1rem; opacity:0.5; }

    .btn-submit { 
      width:100%; padding:18px; background:var(--gradient-primary); border:none; border-radius:16px; 
      color:white; font-size:1.1rem; font-weight:700; cursor:pointer; transition:all 0.4s; box-shadow:0 10px 25px rgba(var(--primary-rgb), 0.3);
    }
    .btn-submit:hover { transform:translateY(-4px); box-shadow:0 15px 35px rgba(var(--primary-rgb), 0.4); }

    .auth-footer { text-align:center; margin-top:32px; color:var(--text-secondary); }
    .auth-footer a { color:var(--primary-500); font-weight:700; text-decoration:none; }

    .back-home { position:fixed; top:40px; left:40px; color:var(--text-primary); text-decoration:none; font-weight:600; padding:10px 20px; background:var(--bg-glass); border-radius:50px; border:1px solid var(--border-color); transition:0.3s; }
    .back-home:hover { background:var(--bg-glass-hover); transform:translateX(-5px); }

    .toast { position:fixed; top:40px; right:40px; padding:16px 24px; border-radius:16px; background:var(--bg-secondary); border-left:4px solid var(--primary-500); transform:translateX(200%); transition:0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275); }
    .toast.visible { transform:translateX(0); }
  </style>
</head>
<body>
  <div class="bg-blobs">
    <div class="blob blob-1"></div>
    <div class="blob blob-2"></div>
  </div>

  <a href="index.html" class="back-home"><span>←</span> Back</a>

  <div class="auth-container">
    <div class="auth-card">
      <div class="auth-header">
        <div class="logo-container">🚀</div>
        <h2>Create Account</h2>
        <p class="subtitle">Join thousands of career-minded professionals</p>
      </div>

      <form id="signup-form">
        <div class="grid-form">
          <div class="form-group full">
            <input type="text" id="name" class="form-input" placeholder="Full Name" required>
            <span class="input-icon">👤</span>
          </div>
          <div class="form-group full">
            <input type="email" id="email" class="form-input" placeholder="Email Address" required>
            <span class="input-icon">✉️</span>
          </div>
          <div class="form-group">
            <input type="password" id="password" class="form-input" placeholder="Password" required minlength="6">
            <span class="input-icon">🔒</span>
          </div>
          <div class="form-group">
            <input type="password" id="confirm-password" class="form-input" placeholder="Confirm" required>
            <span class="input-icon">🛡️</span>
          </div>
          <div class="form-group full">
            <select id="domain" class="form-input" style="padding-left:48px;">
              <option value="software">Software Development</option>
              <option value="data">Data Science & AI</option>
              <option value="design">UI/UX Design</option>
              <option value="marketing">Digital Marketing</option>
              <option value="finance">Finance & Analytics</option>
            </select>
            <span class="input-icon">🎯</span>
          </div>
        </div>

        <button type="submit" class="btn-submit"><span>Create Account</span></button>
      </form>

      <div class="auth-footer">
        Already have an account? <a href="signin.html">Sign In</a>
      </div>
    </div>
  </div>

  <div id="toast" class="toast">
    <span id="toast-icon">✅</span> <span id="toast-msg">Success!</span>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="supabase.js"></script>
  <script>
    const form = document.getElementById('signup-form');
    const toast = document.getElementById('toast');

    function showToast(msg, type = 'success') {
      document.getElementById('toast-msg').textContent = msg;
      document.getElementById('toast-icon').textContent = type === 'success' ? '✅' : '❌';
      toast.className = `toast visible ${type}`;
      setTimeout(() => toast.classList.remove('visible'), 4000);
    }

    form.onsubmit = async (e) => {
      e.preventDefault();
      const name = document.getElementById('name').value;
      const email = document.getElementById('email').value;
      const password = document.getElementById('password').value;
      const confirm = document.getElementById('confirm-password').value;
      const domain = document.getElementById('domain').value;

      if (password !== confirm) return showToast('Passwords do not match', 'error');
      
      const submitBtn = form.querySelector('button[type="submit"] span');
      submitBtn.textContent = 'Creating Account...';

      if (typeof supabaseSignUp === 'function' && supabaseReady) {
        const result = await supabaseSignUp(name, email, password, domain);
        if (result.success) {
          showToast('Account created! Sign in to continue.');
          setTimeout(() => window.location.href = 'signin.html', 1500);
        } else {
          showToast(result.error, 'error');
          submitBtn.textContent = 'Create Account';
        }
      } else {
        localStorage.setItem('vm_current_user', JSON.stringify({ name, email, domain }));
        showToast('Using local storage (Supabase disconnected)');
        setTimeout(() => window.location.href = 'index.html?page=dashboard', 1500);
      }
    };
  </script>
</body>
</html>
